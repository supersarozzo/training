<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com https://world.openfoodfacts.org; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Training">
  <!-- The phone's top strip (clock, battery) in the home-screen app: iOS's own strip ("default"). iOS takes its colour
       from the page. Never the translucent black style: on iOS 26 it made the app one strip too short (SimpleHost). iOS reads
       this tag only when the app is added to the home screen. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Bar colour per phone setting, the page canvas of each look. boot.js and js/theme.js write the Look choice
       into both when it is Light or Dark. docs/checks/2026-11-18-dark-mode.md -->
  <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)">
  <title>Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/v060.css">
  <link rel="stylesheet" href="css/v060-today.css">
  <link rel="stylesheet" href="css/diet.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
